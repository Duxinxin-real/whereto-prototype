<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>逐页还原对照</title><style>*{box-sizing:border-box}body{margin:0;background:#f5edf2;font:15px -apple-system,BlinkMacSystemFont,sans-serif;color:#302530}header{position:sticky;top:0;background:#fffdfdf2;padding:18px 24px;z-index:2;display:flex;align-items:center;gap:18px;flex-wrap:wrap;border-bottom:1px solid #eadde5}h1{font-size:18px;margin:0}select,a{padding:9px 15px;border:1px solid #e7cddd;border-radius:10px;background:white;color:#912656;text-decoration:none}main{display:flex;justify-content:center;gap:24px;padding:24px}figure{margin:0;width:min(42vw,424px)}figcaption{margin:0 0 12px;text-align:center}img{width:100%;display:block;border-radius:28px}footer{text-align:center;padding:15px;color:#71636b}@media(max-width:600px){main{gap:10px;padding:10px}figure{width:48vw}}</style></head><body><header><h1>逐页还原对照</h1><select id="page" aria-label="选择页面"></select><a id="live">打开可交互 HTML</a></header><main><figure><figcaption>原始概念图</figcaption><img id="ref" alt="原始参考"></figure><figure><figcaption>HTML 浏览器截图</figcaption><img id="result" alt="HTML 还原"></figure></main><footer>地图、头像与图标复用原图素材；文字、卡片、表单及交互使用 HTML/CSS/JS。</footer><script>const pages={location:'01 实时定位',activity:'02 自动动态',overview:'03 手机概览',history:'04 历史轨迹',emergency:'05 收到 SOS',setup:'06 SOS 设置',countdown:'07 SOS 倒计时',active:'08 SOS 进行中'};const picker=document.querySelector('#page');Object.entries(pages).forEach(([v,t])=>picker.add(new Option(t,v)));function show(){let k=picker.value;document.querySelector('#ref').src='references/'+k+'.png';document.querySelector('#result').src='screenshots/'+k+'.png';document.querySelector('#live').href=k+'.html'+(k==='countdown'?'?freeze=1':'');}picker.onchange=show;show();</script></body></html>
